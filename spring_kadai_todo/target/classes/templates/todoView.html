<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToDoリスト</title>
    
</head>
<body>

    <h1>ToDoリスト</h1>

    <table border="1">
        <thead>
            <tr>
                <th class="col-id">ID</th>
                <th class="col-title">タイトル</th>
                <th class="col-priority">優先度</th>
                <th class="col-status">ステータス</th>
            </tr>
        </thead>
        <tbody>
           
            <tr th:each="todo : ${todoList}">
                <td class="col-id" th:text="${todo.id}">1</td>
                <td class="col-title" th:text="${todo.title}">サンプルタイトル</td>
                <td class="col-priority" th:text="${todo.priority}">高</td>
                <td class="col-status" th:text="${todo.status}">着手中</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
